siteTitle: Electronic nomination form
title: Ministry of Education and Research of Estonia Kindred Peoples’ Programme awards


text: |
    **Kindred Peoples’ Programme calls for nominations for the Kindred Peoples’ Literary Award 2026!**

    The purpose of the award is to honor writers and translators who either represent or promote the literature of Finno-Ugric peoples without their own statehood. The Kindred Peoples Literary Award is open to

    - a writer or a translator for a work of fiction of excpetional literary and linguistic merit, published in the kindred people’s language over the past four years (2022–2026);
    - a writer or a translator whose activities have notably helped to introduce the literature of statless kindred peoples to Estonian or the wider European public.

    **Deadline for submitting nominations is 21 October 2026.**

    For more information, including a list of past laureates, please [click here](https://eki.ee/hoimurahvaste-kirjandusauhind/).

    NB! Since the electronic form cannot be saved before submission, please fill it out only once you have all the required documents ready for upload with the nomination.

