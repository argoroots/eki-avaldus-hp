        label: Description of the nomination
        type: textarea
        info: |
            Please describe nominee’s activities, add nominee’s CV.

        #    See the [statute of the award](https://eki.ee/wp-content/uploads/2024/09/Kindred-People_s-Literary-Award_Statute.pdf){target="_blank"}.
    -
        id: file
        label: Files
        type: file
        info: |
            Required documents that must be uploaded with the nomination:

            - 1-2 references or recommendation letters (in Estonian, Russian, or English)
            - list of previously published original and/or translated works
            - a PDF file of the published book can also be uploaded to the application or you can send 2 copies of the published book to the postal address

            **NB!** All uploaded file names must include reference to the content of the document and the nominee’s name!
            *E.g.: Reference_JohnSmith; ListOfPublications_JohnSmith.*
    -
        id: urls
        label: Links to additional materials online
        type: textarea
        info: |
            Links to additional materials online, such as media coverage, photo galleries of events, etc., may be added.

